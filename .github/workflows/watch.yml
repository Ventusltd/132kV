name: watch

# Once a day, on GitHub's machine: check the arithmetic, ask the public catalogue what changed, write
# down only what changed. No assistant, no paid credit, no key. It commits only when something changed.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ventusltd/kuiper-belt
          path: kb
          sparse-checkout: tools
      - name: The arithmetic still gives the published table
        run: python3 tools/capacity.py --check
      - name: Watch the public catalogue, and fail closed
        if: github.event_name != 'push'
        run: python3 tools/watch_catalogue.py
      - name: Commit only what changed
        if: github.event_name != 'push'
        run: |
          git config user.name "132kV-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalogue.tsv data/ledger.tsv NOW.md
          git diff --cached --quiet && exit 0
          git commit -q -m "watch: what changed in the public catalogue"
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
